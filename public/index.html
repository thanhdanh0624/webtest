<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý sinh viên</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="p-3 mb-4 bg-primary text-white rounded text-center">
        <h2>QUẢN LÝ SINH VIÊN</h2>
        <p class="mb-0">Ứng dụng điện toán đám mây - Microsoft Azure</p>
      </div>

      <!-- Form thêm sinh viên -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h4 class="card-title mb-3">Thông tin sinh viên</h4>
          <form id="studentForm">
            <div class="mb-3">
              <input
                type="text"
                id="MaSV"
                class="form-control"
                placeholder="Mã sinh viên"
                required
              />
            </div>
            <div class="mb-3">
              <input
                type="text"
                id="HoTen"
                class="form-control"
                placeholder="Họ và tên"
                required
              />
            </div>
            <div class="mb-3">
              <input type="date" id="NgaySinh" class="form-control" />
            </div>
            <div class="mb-3">
              <input
                type="text"
                id="Lop"
                class="form-control"
                placeholder="Lớp"
              />
            </div>
            <div class="mb-3">
              <input
                type="email"
                id="Email"
                class="form-control"
                placeholder="Email"
              />
            </div>
            <button type="submit" class="btn btn-primary">
              Thêm sinh viên
            </button>
            <button type="reset" class="btn btn-secondary">Hủy</button>
          </form>
        </div>
      </div>

      <!-- Bảng danh sách sinh viên -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Danh sách sinh viên</h4>
          <table class="table table-bordered table-striped">
            <thead>
              <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Lớp</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      async function loadStudents() {
        const res = await fetch("/api/sinhvien");
        const data = await res.json();
        const tbody = document.getElementById("studentTableBody");
        tbody.innerHTML = "";
        data.forEach((sv) => {
          tbody.innerHTML += `<tr>
                    <td>${sv.MaSV}</td>
                    <td>${sv.HoTen}</td>
                    <td>${sv.NgaySinh ? sv.NgaySinh.split("T")[0] : ""}</td>
                    <td>${sv.Lop || ""}</td>
                    <td>${sv.Email || ""}</td>
                </tr>`;
        });
      }
      document
        .getElementById("studentForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const sv = {
            MaSV: document.getElementById("MaSV").value,
            HoTen: document.getElementById("HoTen").value,
            NgaySinh: document.getElementById("NgaySinh").value,
            Lop: document.getElementById("Lop").value,
            Email: document.getElementById("Email").value,
          };
          await fetch("/api/sinhvien", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(sv),
          });
          loadStudents();
          e.target.reset();
        });

      loadStudents();
    </script>
  </body>
</html>
